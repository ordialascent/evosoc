# One-off sanity check of conventional settings for the baseline GA
# (see docs/baseline-ga.md, "Parameter check"). Deliberately small: one
# change at a time from the default, no combined search.

name = "baseline-check"
budget = 200_000
seeds = 10
baseline = "default"

[[problems]]
type = "tsplib"
name = "berlin52"

[[problems]]
type = "tsplib"
name = "kroA100"

[[variants]]
name = "default"
algorithm = "steady_state_ga"
params = { pop_size = 200, mutation_rate = 0.2 }

[[variants]]
name = "mutation-1.0"
algorithm = "steady_state_ga"
params = { pop_size = 200, mutation_rate = 1.0 }

[[variants]]
name = "pop-1000"
algorithm = "steady_state_ga"
params = { pop_size = 1000, mutation_rate = 0.2 }

[[variants]]
name = "ox"
algorithm = "steady_state_ga"
params = { pop_size = 200, mutation_rate = 0.2, crossover = "ox" }
