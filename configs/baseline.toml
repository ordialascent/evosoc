# The baseline GA on its own, with random search as the floor every GA
# must clear. The numbers in docs/baseline-ga.md come from this config.

name = "baseline"
budget = 200_000
seeds = 20
baseline = "baseline"

[[problems]]
type = "tsplib"
name = "eil51"

[[problems]]
type = "tsplib"
name = "berlin52"

[[problems]]
type = "tsplib"
name = "kroA100"

[[variants]]
name = "baseline"
algorithm = "steady_state_ga"
params = { pop_size = 200, crossover_rate = 0.9, mutation_rate = 0.2 }

[[variants]]
name = "random-search"
algorithm = "random_search"
params = { batch = 200 }
