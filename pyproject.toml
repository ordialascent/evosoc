[project]
name = "evosoc"
version = "0.1.0"
description = "A game show of genetic algorithms: Team Centralizers vs Team Decentralizers."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = {find = {include = ["evosoc*"]}}

[tool.pytest.ini_options]
testpaths = ["tests"]
